# 전선 검출 파이프라인 기본 설정
# 경로는 저장소 루트 기준 상대경로

data:
  root: dataset
  frames: auto                 # XML이 있는 dataset 하위 폴더 전부 (또는 [frame_1, frame_2] 처럼 지정)
  image_dir: images            # 우선 찾는 이미지 폴더. 없으면 하위 폴더 전체에서 파일명으로 찾음
  annotation_glob: "*.xml"     # dataset/<frame>/*.xml (CVAT for images 1.1)
  # XML에 'powerline'과 'polyline' 두 라벨이 섞여 있음 → 둘 다 전선으로 취급
  positive_labels: [powerline, polyline]

gt:
  line_thickness: 6            # 정답 polyline을 마스크로 그릴 때 두께(px, 원본 4K 기준)

eval:
  tolerance_px: 10             # 예측 선이 정답 선에서 이 거리 이내면 맞은 것으로 봄
  instance_match_ratio: 0.5    # 후보 골격의 이 비율 이상이 정답 근처면 TP 후보

# 학습 없음: 사전학습 모델(LangSAM = GroundingDINO + SAM)을 그대로 사용
detectors:
  langsam:
    text_prompts: ["power line", "electric wire", "cable"]
    box_threshold: 0.2          # 후보 추출은 recall 우선: GroundingDINO 기본값(0.3)보다 낮게
    text_threshold: 0.2
    tile:
      enabled: true
      size: 1280
      overlap: 0.2
    min_area_px: 200

router:
  # 이 구간의 검출 점수는 '불확실'로 보고 VLM에 보냄 (keep_score 근처)
  score_low: 0.2
  score_high: 0.45
  # 아래 규칙 중 하나라도 걸리면 점수와 무관하게 VLM에 보냄
  suspect_rules:
    lane_marking: true          # 밝고 채도 낮은(흰/노랑) 직선
    # 주의: 위에서 내려다본 전선도 지면보다 어둡게 보이는 경우가 많아 이 규칙은 진짜 전선도 많이 보냄
    #       → VLM 호출 수가 늘어남. 실데이터로 비용/효과를 보고 조정할 것
    shadow: true                # 주변보다 어두운 선
    orientation_outlier: true   # 다른 전선 후보들과 방향이 크게 다름
    short_segment: true         # 짧은 조각

marking:
  crop_context: 1.6             # 후보 bbox 대비 crop 확대 배율
  crop_max_side: 768
  overview_max_side: 1568

vlm:
  backend: qwen                 # qwen(로컬 GPU, 무료) | claude(API, 유료) | mock
  claude:
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
    fallbacks: true             # 안전 분류기 거절 시 서버측 대체 모델로 재시도
  qwen:
    model: Qwen/Qwen2.5-VL-7B-Instruct
    device: auto                # GPU 자동 배치
    max_new_tokens: 1024

fusion:
  reject_confidence: 0.6        # VLM이 이 확신도 이상으로 '전선 아님'이면 제거
  accept_confidence: 0.6        # VLM이 이 확신도 이상으로 '전선'이면 유지(점수 낮아도)
  # 검출 점수 기준선. 'LangSAM 단독(기준 방식)'은 이 점수 이상 후보를 전부 전선으로 봄.
  # GroundingDINO 기본 box_threshold(0.3)와 같게 둠. VLM을 거치지 않은 후보도 이 기준으로 결정
  keep_score: 0.3

report:
  llm_backend: qwen             # qwen | claude | none (none이면 템플릿 문장으로 작성)
  title: "드론 영상 전선 검출 결과 보고서"
  organization: "26 캡스톤"
  author: ""
  reviewer: ""
  doc_number_prefix: "PL"
  max_cases: 2

output:
  root: outputs
